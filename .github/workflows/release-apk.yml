name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare fallback debug.keystore and decode release keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 1. Гарантируем наличие debug.keystore в корне проекта (на случай если секреты ещё не заданы)
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ] && [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
            tr -d '\r\n ' < "${GITHUB_WORKSPACE}/debug.keystore.base64" | base64 --decode > "${GITHUB_WORKSPACE}/debug.keystore" || true
          fi

          # 2. Декодируем постоянный релизный ключ из секрета KEYSTORE_BASE64 в файл keystore.jks
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf "%s" "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode -i > "${GITHUB_WORKSPACE}/keystore.jks"
            cp "${GITHUB_WORKSPACE}/keystore.jks" "${GITHUB_WORKSPACE}/app/keystore.jks"
            echo "Release keystore decoded successfully (${GITHUB_WORKSPACE}/keystore.jks)"
          else
            echo "WARNING: KEYSTORE_BASE64 secret is empty. Falling back to debug.keystore."
          fi

      - name: Build signed Release APK (assembleRelease)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-v0.0.5}"
          VERSION_NAME="${RAW_TAG#v}"
          ./gradlew assembleRelease \
            -PversionName="${VERSION_NAME}" \
            -Pksp.incremental=false \
            -Pksp.useKSP2=true \
            -Pandroid.disallowKotlinSourceSets=false \
            --no-configuration-cache \
            --stacktrace

      - name: Prepare signed app-release.apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found in app/build/outputs/apk/release!"
            exit 1
          fi
          cp "$APK_PATH" "app-release.apk"
          echo "Signed APK ready: app-release.apk (from $APK_PATH)"

      - name: Upload app-release.apk as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-release.apk

      - name: Create GitHub Release and attach app-release.apk
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
