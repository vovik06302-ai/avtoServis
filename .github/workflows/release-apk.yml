name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare Release Keystore (if not provided via secrets)
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=AutoService, OU=Workshop, O=AutoService, L=Moscow, S=Moscow, C=RU"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          ./gradlew assembleRelease \
            --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=daemon \
            -Pksp.incremental=false \
            --stacktrace

      - name: Rename APK for Release
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION_NAME="${RAW_TAG#v}"
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found!"
            exit 1
          fi
          cp "$APK_PATH" "autoservice-${VERSION_NAME}.apk"

      - name: Create GitHub Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: autoservice-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
