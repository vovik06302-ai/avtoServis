name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Скачивание кода репозитория
        uses: actions/checkout@v4

      - name: 2. Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Если вы используете гибридную сборку React + Vite + Capacitor, раскомментируйте шаги Node.js ниже:
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #     cache: 'npm'
      # - name: Build Web & Sync Capacitor
      #   run: |
      #     npm ci
      #     npm run build
      #     npx cap sync android

      - name: 3. Сборка Android APK (Gradle)
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: 4. Переименование APK с номером версии
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "autoservice-${VERSION_NAME}.apk"

      - name: 5. Публикация GitHub Release и прикрепление файла .apk
        uses: softprops/action-gh-release@v2
        with:
          files: autoservice-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
